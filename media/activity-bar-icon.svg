<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- Pixel-art robot cat head, matching the "Byte" character. -->
  <g fill="#7C5CFF">
    <!-- left ear -->
    <rect x="3" y="3" width="2" height="2"/>
    <rect x="3" y="5" width="3" height="2"/>
    <!-- right ear -->
    <rect x="19" y="3" width="2" height="2"/>
    <rect x="18" y="5" width="3" height="2"/>
    <!-- head -->
    <rect x="5" y="6" width="14" height="11"/>
  </g>
  <!-- face plate -->
  <rect x="8" y="8" width="8" height="6" fill="#1B1030"/>
  <!-- eyes -->
  <rect x="9" y="10" width="2" height="2" fill="#5FE8F7"/>
  <rect x="13" y="10" width="2" height="2" fill="#5FE8F7"/>
  <!-- muzzle / mouth -->
  <rect x="11" y="13" width="2" height="1" fill="#5FE8F7"/>
  <!-- paws -->
  <rect x="5" y="17" width="4" height="3" fill="#7C5CFF"/>
  <rect x="15" y="17" width="4" height="3" fill="#7C5CFF"/>
  <!-- accent -->
  <rect x="5" y="15" width="14" height="1" fill="#5FE8F7"/>
</svg>
